name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m compileall custom_components/hunonic
          python -m json.tool custom_components/hunonic/manifest.json >/dev/null
          python -m json.tool custom_components/hunonic/strings.json >/dev/null
